name: Live refresh (official results APIs, changed LLM boards)

# Boards that publish results through an API (P = NP?, Big O Speedrun, GPU MODE, ROCm llama.cpp, LeanEval, First Proof, DuckBench,
# Open Discovery Challenge) are re-read every three hours with no discovery and no LLM calls. LLM-extracted boards are re-extracted
# only when a file the extractor read (README, leaderboard files) changed since their last extraction, at most LIVE_RECRAWL_MAX
# (default 4) per run; a code-only push never reaches the LLM. So new entries reach the site within hours instead of at the
# weekly crawl. The same run re-reads Palomar's registry for "Fresh discoveries" (data/discoveries.json); that file is rewritten
# only when what it shows changed, and a failed read leaves it as it was.
#
# It also runs the PROBLEM.md priority lane for repositories not on the list yet (the open-challenge-list topic, listing issues,
# code search, seeds), so an organizer who adopts the standard is listed within hours; after the push, listing issues get the
# link (or, once, the reason the repository was not listed).
#
# Each run also re-checks which organizers publish instructions for agents (data/agent-docs.json, scripts/agent-docs.ts), so the
# board pages and digests link them.
#
# GitHub starts this repo's scheduled runs hours late or drops them (the weekly crawl fires 8–10 hours after its slot; the first
# three-hourly slots never fired), so the schedule asks every 30 minutes and a refresh goes ahead only when none succeeded or
# started in the last 2 h 40 min. Whichever scheduled runs do arrive keep the cadence near three hours.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SELF: ${{ github.run_id }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # the newest other run whose refresh job succeeded, or that is still queued or running (a scheduled check that
          # found nothing due also ends "success", with its refresh job skipped, so it does not count)
          last=""
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow live.yml -L 30 --json databaseId,status,conclusion \
              -q ".[] | select(.databaseId != $SELF and (.status != \"completed\" or .conclusion == \"success\")) | .databaseId"); do
            last=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json status,jobs,createdAt \
              -q 'if .status != "completed" or any(.jobs[]; .name == "live" and .conclusion == "success") then .createdAt else "" end')
            [ -n "$last" ] && break
          done
          age=$(( $(date -u +%s) - $(date -u -d "${last:-1970-01-01T00:00:00Z}" +%s) ))
          echo "last refresh started ${last:-never} (${age}s ago)"
          if [ "$age" -ge 9600 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  live:
    needs: due
    if: needs.due.outputs.run == 'true'
    concurrency:
      group: crawl
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write   # reads listing issues, answers and closes them
    runs-on: ubuntu-latest
    # re-extractions stop starting after 30 minutes; one in flight may take up to 2 × the 10-minute LLM timeout; then the
    # priority lane (at most 30 minutes), the agent-docs check (at most 5) and the listing answers (waiting at most 8 minutes for
    # the deploy)
    timeout-minutes: 105
    steps:
      # the branch head when the job starts, not the commit it was queued on: another data writer in the
      # "crawl" concurrency group may have pushed in between, and its data must be the base for ours
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch public Kaggle leaderboards
        uses: ./.github/actions/read-kaggle
        continue-on-error: true
        with:
          token: ${{ secrets.KAGGLE_API_TOKEN }}
          username: ${{ secrets.KAGGLE_USERNAME }}
          key: ${{ secrets.KAGGLE_KEY }}

      - name: Refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npx tsx src/main.ts live

      # After the refresh, so the refresh never waits on it and cannot be broken by it. Only repositories not on the list yet;
      # it merges its new boards into the refreshed file and leaves every other board byte for byte as the refresh wrote it
      # (main.ts mergeLane). Nothing new: nothing written. A failure here only skips the lane this time.
      - name: Priority lane (new PROBLEM.md repositories)
        continue-on-error: true
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEW_ONLY: "1"
        run: npx tsx src/main.ts priority || { echo "::warning::priority lane failed; the live refresh is committed without it"; exit 1; }

      # Links to the organizers' own instructions for agents (AGENTS.md, CLAUDE.md, llms.txt at the repository root, an llms.txt on
      # the competition's site), boards from the priority lane included. One GitHub call per repository; data/agent-docs.json has no
      # timestamp, so it changes only when the docs did. A board whose source gave no answer keeps its last entry; a failure here
      # leaves the file as it was.
      - name: Organizer instructions for agents
        continue-on-error: true
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/agent-docs.ts

      - name: README "Open right now"
        run: npx tsx src/readme.ts

      - name: Commit data
        run: |
          # new entries, new Palomar registrations, state a re-extraction or date lookup moved (without it the next run would redo that
          # work), or organizer instructions for agents that appeared, moved or went away
          if ! node scripts/entries-changed.mjs && git diff --quiet -- data/crawl-state.json data/commit-dates.json data/discoveries.json data/agent-docs.json; then echo "no new entries"; exit 0; fi
          git config user.name "openchallengelist-bot"
          git config user.email "bot@users.noreply.github.com"
          # discovered.json: the priority lane's new repositories, which the next refresh follows for changes
          git add data/competitions.json data/crawl-state.json data/commit-dates.json data/discoveries.json data/discovered.json data/agent-docs.json README.md
          git commit -m "data: live refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase origin "$GITHUB_REF_NAME" || exit 1; done; exit 1

      # After the push: a "listed" answer links a page this push deploys (the script waits for it). The script reads the issues
      # through the API; no issue text reaches this shell.
      - name: Answer listing issues
        continue-on-error: true
        timeout-minutes: 12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/answer-listing-issues.ts

name: Publish MCP server to the registry
# Lists https://openchallengelist.com/mcp (server.json) in the official MCP Registry under io.github.open-challenges/*.
# Manual only: publishing is outward-facing, so a person starts it. Bump server.json "version" for each republish.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write   # GitHub OIDC proves the io.github.open-challenges namespace; no stored token
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.9   # pinned and Sigstore-verified; upgrade deliberately
    steps:
      - uses: actions/checkout@v4
      - name: The endpoint answers before it is listed
        run: |
          curl --fail --silent --show-error -X POST https://openchallengelist.com/mcp -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q '"find_challenges"'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

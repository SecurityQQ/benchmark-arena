name: Crawl priority lane (PROBLEM.md / SUBMISSION.md)

# Repositories that ship PROBLEM.md and SUBMISSION.md, found by code search, the open-challenge-list topic, listing issues and the
# seeds. Every live refresh (live.yml) already runs this lane for repositories not on the list yet, and the weekly full crawl
# (crawl.yml) processes them first; this manual run also re-reads the listed ones.
on:
  workflow_dispatch:

concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write
  issues: read   # listing issues name repositories that ship PROBLEM.md

jobs:
  priority:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # the branch head when the job starts, not the commit it was queued on: another data writer in the
      # "crawl" concurrency group may have pushed in between, and its data must be the base for ours
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Crawl priority lane
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npx tsx src/main.ts priority
      - name: Commit data
        run: |
          git config user.name "openchallengelist-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: priority crawl $(date -u +%Y-%m-%dT%H:%MZ)"
          # a merge to master during the crawl must not lose its results
          for i in 1 2 3; do git push && exit 0; git pull --rebase origin "$GITHUB_REF_NAME" || exit 1; done; exit 1

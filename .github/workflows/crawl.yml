name: Crawl competitions

on:
  schedule:
    - cron: "17 3 * * 1"        # weekly, Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "full = discover + process, process = re-process discovered repos"
        default: "full"
        type: choice
        options: [full, process]
      force:
        description: "re-process every repo, ignoring the unchanged/rejected skips"
        default: false
        type: boolean

concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # the branch head when the job starts, not the commit it was queued on: another data writer in the
      # "crawl" concurrency group may have pushed in between, and its data must be the base for ours
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Restore fetch cache
        uses: actions/cache@v4
        with:
          path: cache
          key: fetch-cache-${{ github.run_id }}
          restore-keys: fetch-cache-

      - name: Crawl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          # attribution evidence (commits/PRs) must be fresh; README cache can be reused
          rm -f cache/*__attribution__.txt
          npx tsx src/main.ts "${{ inputs.mode || 'full' }}"

      - name: Sanity check
        run: |
          node -e '
            const d = require("./data/competitions.json");
            const recs = d.competitions.reduce((s,c)=>s+c.stats.totalRecords,0);
            console.log(`${d.competitions.length} competitions, ${recs} records`);
            if (d.competitions.length < 10 || recs < 200) { console.error("suspiciously small result, refusing to commit"); process.exit(1); }
          '

      - name: README "Open right now"
        run: npx tsx src/readme.ts

      - name: Commit data
        run: |
          git config user.name "openchallengelist-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ README.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: crawl $(date -u +%Y-%m-%dT%H:%MZ)"
          # a merge to master during the crawl must not lose its results
          for i in 1 2 3; do git push && exit 0; git pull --rebase origin "$GITHUB_REF_NAME" || exit 1; done; exit 1
